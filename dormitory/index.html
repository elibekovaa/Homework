<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заселение в общежитие</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Заселение в общежитие</h1>

        <p class="subtitle">
            Заполните данные для проверки возможности заселения
        </p>

        <form id="dormitoryForm">

            <label for="studentId">
                ID студента
            </label>

            <input type="number" id="studentId" placeholder="Введите ID студента" required>

            <label for="buildingNumber">
                Номер корпуса
            </label>

            <input type="number" id="buildingNumber" placeholder="Введите номер корпуса" required>

            <label for="roomNumber">
                Номер комнаты
            </label>

            <input type="number" id="roomNumber" placeholder="Введите номер комнаты" required>

            <button type="submit">
                Проверить
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
